# Гейт «готово» на чужой машине.
#
# Workflow не заводит собственных проверок и не знает, что такое «готово»: он
# готовит окружение и зовёт ./scripts/verify.sh — тот же скрипт, который зовут
# руками перед коммитом. Второе определение «готово», живущее в YAML, разъедется
# с первым в тот же месяц, и узнают об этом по зелёному CI на сломанной ветке.
#
# Голдены — вторая половина того же гейта, отрезанная по платформе: Windows и
# Linux растрируют текст по-разному, и эталоны существуют ровно для одной.
# Платформа эталонов — Linux, и снимает их этот workflow. Решение и его цена —
# docs/dev/goldens.md.

name: verify

# push только на master плюс pull_request. Оба триггера на одной ветке дали бы
# два одинаковых прогона, а шум приучает не смотреть на CI ровно так же, как
# заведомо красный шаг.
on:
  push:
    branches: [master]
  pull_request:

# Новый пуш гасит предыдущий прогон той же ветки.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Ровно та версия, на которой написан код и сняты эталоны: Flutter 3.29.2,
  # Dart 3.7.2, engine 18b71d647a. Голдены чувствительны к версии движка —
  # менять её значит пересматривать все восемь кадров.
  FLUTTER_VERSION: '3.29.2'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Пин на commit SHA, а не на тег: теги v2 и v2.23.0 подвижны, SHA — нет.
      # Сегодня оба указывают сюда же; комментарий рядом с SHA — единственное
      # место, где видно, какая это версия.
      #
      # cache: true кэширует и сам SDK, и ~/.pub-cache. Отдельный actions/cache
      # не нужен: ключ pub-кэша внутри action'а уже включает
      # hashFiles('**/pubspec.lock'), а pubspec.lock у нас в репозитории.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Версия попадает в лог прогона намеренно: вывод гейта вставляют в ответ
      # как доказательство, и доказательство должно называть, чем оно получено.
      - name: Версия SDK
        run: flutter --version

      - name: Зависимости
        run: flutter pub get

      - name: verify.sh — всё, кроме кадров
        env:
          # Кавычки обязательны: без них YAML прочитает off как false.
          WORDARCADE_GOLDENS: 'off'
        run: ./scripts/verify.sh

      # Фаза 1: голдены ещё не блокируют.
      #
      # Эталоны в репозитории сняты на Windows, на Linux они красные заведомо.
      # Заведомо красный шаг, «который так и должен», за неделю приучает не
      # смотреть на красное — поэтому шаг существует не как гейт, а как
      # съёмочная камера: он рождает Linux-кандидатов, которые человек примет
      # по docs/dev/goldens.md (фаза 2). После приёмки continue-on-error
      # снимается, и это фаза 3.
      #
      # !cancelled(), а не success(): половины гейта — ровесники, а не цепочка.
      # Кадры рисуются независимо от того, прошёл ли analyze, и в фазе 1 они
      # нужны даже с красной первой половиной.
      - name: Голдены — снимаем кадры, пока не блокируют (фаза 1)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./scripts/goldens.sh

      # Кандидатов пишет компаратор из test/golden/flutter_test_config.dart:
      # --update-goldens в проекте выключен на уровне кода, эталон принимает
      # человек переименованием. Артефакт — единственный способ показать ему
      # картинку с чужой машины.
      - name: Кандидаты в эталоны и попиксельная разница
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goldens-linux-${{ github.sha }}
          path: |
            test/golden/images/*.new.png
            test/golden/failures/**
          # warn, а не ignore: пустой артефакт — это новость. Либо кадры сошлись
          # (фаза 3 уже позади), либо тесты не дошли до отрисовки.
          if-no-files-found: warn
          retention-days: 14
