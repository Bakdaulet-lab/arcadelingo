# Объявление тегов для package:test.
#
# `golden` — восемь тестов-картинок в
# test/golden/falling_words_golden_test.dart. Тег нужен, чтобы гейт можно было
# разделить по платформам: эталоны существуют ровно для одной, и это Linux
# (docs/dev/goldens.md). На Windows и на CI до фазы 3 голдены отсекаются
# через `flutter test --exclude-tags golden` из scripts/verify.sh.
#
# Две канарейки шрифтов в том же файле тегом НЕ помечены, и это не забывчивость.
# Они не сравнивают картинки — они проверяют, что в этом окружении вообще
# приехал Rubik и что ось wght применилась. Ответ «шрифт не загрузился» нужен
# на чужой машине сильнее, чем на своей, поэтому канарейки идут во всех режимах.
tags:
  golden:
    # Ничего не переопределяем: тег объявлен, чтобы package:test не
    # предупреждал о незнакомом имени на каждом прогоне.
