# Объявление тегов для package:test.
#
# `golden` — восемь тестов-картинок в
# test/golden/falling_words_golden_test.dart. Тег нужен, чтобы гейт можно было
# разделить по платформам: эталоны существуют ровно для одной, и это Linux
# (docs/dev/goldens.md). Локально голдены отсекаются, на CI это блокирующий шаг.
#
# Две канарейки шрифтов в том же файле тегом НЕ помечены, и это не забывчивость.
# Они не сравнивают картинки — они проверяют, что в этом окружении вообще
# приехал Rubik и что ось wght применилась. Ответ «шрифт не загрузился» нужен
# на чужой машине сильнее, чем на своей, поэтому канарейки идут во всех режимах.
#
# `peek` — снималка экранов в test/peek/. Не тесты: ничего не проверяют и
# всегда зелёные, поэтому в гейт не входят никогда.
tags:
  golden:
    # Ничего не переопределяем: тег объявлен, чтобы package:test не
    # предупреждал о незнакомом имени на каждом прогоне.
  peek:

# ВНИМАНИЕ: `exclude_tags: peek` сюда добавлять нельзя, как бы логично это ни
# выглядело. Измерено на flutter test 3.29.2:
#
#   exclude_tags: peek  +  flutter test --tags peek test/peek/
#   -> No tests ran. include: "peek", exclude: "peek"
#
# Исключение из конфига побеждает явный запрос с командной строки, и
# санкционированная ручная съёмка перестала бы работать вовсе. Обойти нечем:
# `--exclude-tags ""` — ошибка разбора аргументов, `--preset` и
# `--configuration` flutter test не поддерживает (в отличие от голого
# dart test).
#
# Поэтому исключение живёт там, где определяется прогон по умолчанию:
# scripts/verify.sh отсекает `golden || peek`, а scripts/goldens.sh берёт
# `--tags golden`, куда peek не попадает по построению. CI зовёт только их
# двоих, так что в CI снималка не попадает ни при каком режиме.
